all:
  children:
    web:
      hosts:
        web-01:
          ansible_host: "{{ vm_floating_ip }}"
          ansible_user: ubuntu
          ansible_ssh_private_key_file: ~/.ssh/openstack-lab-vm
          ansible_python_interpreter: /usr/bin/python3.12
    db:
      hosts:
        db-01:
          ansible_host: "{{ db_fixed_ip }}"
          ansible_user: ubuntu
          ansible_ssh_private_key_file: ~/.ssh/openstack-lab-vm
          ansible_ssh_common_args: "-o ProxyJump=ubuntu@{{ vm_floating_ip }}"
          ansible_python_interpreter: /usr/bin/python3.12
  vars:
    vm_floating_ip: "192.168.0.169"
    web_fixed_ip: "10.20.0.15"
    db_fixed_ip: "10.20.0.197"