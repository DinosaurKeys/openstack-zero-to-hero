---
- name: Create tasks table for Flask Task Manager
  hosts: db
  become: true

  tasks:
    - name: Install python3-psycopg2 for PostgreSQL modules
      ansible.builtin.apt:
        name: python3-psycopg2
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Create public.tasks table in appdb with owner appuser
      community.postgresql.postgresql_table:
        login_db: appdb
        name: public.tasks
        columns:
          - "id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY"
          - "title TEXT NOT NULL"
          - "completed BOOLEAN NOT NULL DEFAULT FALSE"
        owner: appuser
        state: present
      become: true
      become_user: postgres

    - name: Verify tasks table exists and has correct columns (read-only)
      community.postgresql.postgresql_query:
        login_db: appdb
        query: |
          SELECT column_name, data_type, is_nullable, column_default
          FROM information_schema.columns
          WHERE table_schema = 'public' AND table_name = 'tasks'
          ORDER BY ordinal_position;
      register: tasks_columns
      become: true
      become_user: postgres
      changed_when: false

    - name: Verify tasks table structure
      ansible.builtin.assert:
        that:
          - "tasks_columns.query_result | length == 3"
          - "tasks_columns.query_result[0].column_name == 'id'"
          - "tasks_columns.query_result[0].data_type == 'bigint'"
          - "tasks_columns.query_result[0].is_nullable == 'NO'"
          - "tasks_columns.query_result[1].column_name == 'title'"
          - "tasks_columns.query_result[1].data_type == 'text'"
          - "tasks_columns.query_result[1].is_nullable == 'NO'"
          - "tasks_columns.query_result[2].column_name == 'completed'"
          - "tasks_columns.query_result[2].data_type == 'boolean'"
          - "tasks_columns.query_result[2].is_nullable == 'NO'"
        fail_msg: "Tasks table structure verification failed"
        success_msg: "Tasks table structure verified"
      changed_when: false

    - name: Verify identity column and primary key (read-only)
      community.postgresql.postgresql_query:
        login_db: appdb
        query: |
          SELECT
              a.attname AS column_name,
              a.attidentity = 'd' AS is_identity,
              EXISTS (
                  SELECT 1
                  FROM pg_constraint c
                  JOIN pg_attribute a2 ON a2.attrelid = c.conrelid AND a2.attnum = ANY(c.conkey)
                  WHERE c.conrelid = 'public.tasks'::regclass
                    AND c.contype = 'p'
                    AND a2.attname = a.attname
              ) AS is_primary_key
          FROM pg_attribute a
          WHERE a.attrelid = 'public.tasks'::regclass
            AND a.attnum > 0
            AND NOT a.attisdropped
            AND a.attname = 'id';
      register: tasks_id_pk
      become: true
      become_user: postgres
      changed_when: false

    - name: Verify identity column and primary key
      ansible.builtin.assert:
        that:
          - "tasks_id_pk.query_result | length == 1"
          - "tasks_id_pk.query_result[0].column_name == 'id'"
          - "tasks_id_pk.query_result[0].is_identity == True"
          - "tasks_id_pk.query_result[0].is_primary_key == True"
        fail_msg: "Identity column and primary key verification failed"
        success_msg: "Identity column and primary key verified"
      changed_when: false

    - name: Verify tasks table ownership and permissions (read-only)
      community.postgresql.postgresql_query:
        login_db: appdb
        query: |
          SELECT
              c.relname AS table_name,
              pg_get_userbyid(c.relowner) AS owner,
              has_table_privilege('appuser', c.oid, 'SELECT') AS can_select,
              has_table_privilege('appuser', c.oid, 'INSERT') AS can_insert,
              has_table_privilege('appuser', c.oid, 'UPDATE') AS can_update,
              has_table_privilege('appuser', c.oid, 'DELETE') AS can_delete
          FROM pg_class c
          JOIN pg_namespace n ON n.oid = c.relnamespace
          WHERE n.nspname = 'public' AND c.relname = 'tasks';
      register: tasks_perms
      become: true
      become_user: postgres
      changed_when: false

    - name: Verify table ownership and appuser permissions
      ansible.builtin.assert:
        that:
          - "tasks_perms.query_result | length == 1"
          - "tasks_perms.query_result[0].owner == 'appuser'"
          - "tasks_perms.query_result[0].can_select == True"
          - "tasks_perms.query_result[0].can_insert == True"
          - "tasks_perms.query_result[0].can_update == True"
          - "tasks_perms.query_result[0].can_delete == True"
        fail_msg: "Tasks table ownership/permissions verification failed"
        success_msg: "Tasks table ownership and appuser permissions verified"
      changed_when: false

    - name: Display verification summary
      ansible.builtin.debug:
        msg:
          - "Tasks table created/verified in appdb"
          - "Owner: appuser"
          - "Columns: id (bigint, PK, identity), title (text, not null), completed (boolean, default false)"
          - "appuser permissions: SELECT, INSERT, UPDATE, DELETE"